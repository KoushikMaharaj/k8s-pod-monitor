name: Build Native Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:

  # ── Windows (.exe via jpackage app-image) ───────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn clean package -DskipTests

      - name: Create Windows app-image
        run: |
          jpackage `
            --type app-image `
            --input target `
            --name PodStatusNotifier `
            --main-jar pod-status-notifier-1.0.0.jar `
            --main-class com.example.podmonitor.PodStatusNotifier `
            --app-version 1.0.0 `
            --dest dist `
            --java-options "-Xmx256m" `
            --win-console

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PodStatusNotifier -DestinationPath dist/PodStatusNotifier-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodStatusNotifier-Windows
          path: dist/PodStatusNotifier-Windows.zip
          retention-days: 30

  # ── Release ──────────────────────────
  release:
    needs: [ build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pod Status Notifier ${{ github.ref_name }}"
          body: |
            ## Pod Status Notifier ${{ github.ref_name }}

            Native executables for all platforms — no Java installation required.

            | Platform | File | How to run |
            |----------|------|-----------|
            | Windows  | `PodStatusNotifier-Windows.zip` | Extract → run `PodStatusNotifier/PodStatusNotifier.exe` |

          files: |
            dist/PodStatusNotifier-Windows.zip
          draft: false
          prerelease: false