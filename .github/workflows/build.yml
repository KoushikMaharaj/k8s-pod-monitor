name: Build Native Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── Windows Installer (.exe via jpackage) ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/package-input
          Copy-Item "target/pod-status-notifier-1.0.0.jar" -Destination "target/package-input"

      - name: Create Windows Installer
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --input target/package-input `
            --name PodStatusNotifier `
            --main-jar pod-status-notifier-1.0.0.jar `
            --main-class com.example.podmonitor.PodStatusNotifier `
            --app-version 1.0.0 `
            --dest dist `
            --java-options "-Xmx256m" `
            --win-console `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodStatusNotifier-Installer
          path: dist/*.exe
          retention-days: 30

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    needs: [ build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pod Status Notifier ${{ github.ref_name }}"
          body: |
            ## Pod Status Notifier ${{ github.ref_name }}

            Native installer for Windows — no Java installation required.

            | Platform | File | Installation |
            |----------|------|--------------|
            | Windows  | `PodStatusNotifier-1.0.0.exe` | Run the installer to install the app and create desktop/start shortcuts. |
          files: dist/*.exe
          draft: false
          prerelease: false
